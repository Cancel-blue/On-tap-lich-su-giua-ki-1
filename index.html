<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đấu trường Lịch sử</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,Arial,sans-serif;
  background:#070c18;
  background-image:radial-gradient(ellipse at 12% -10%,rgba(29,58,138,.55),transparent 55%),radial-gradient(ellipse at 92% 110%,rgba(124,58,237,.42),transparent 55%);
  background-attachment:fixed;
  min-height:100vh;color:#e2e8f0;padding:16px;
  display:flex;justify-content:center;align-items:flex-start;
  -webkit-tap-highlight-color:transparent;
}
.app{width:100%;max-width:880px;margin:auto}
.screen{display:none;animation:fade .35s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:rgba(20,29,48,.82);border:1px solid rgba(56,189,248,.18);border-radius:20px;padding:26px 24px;box-shadow:0 24px 60px rgba(0,0,0,.55);backdrop-filter:blur(8px)}
h1{font-size:clamp(22px,5vw,34px);text-align:center;letter-spacing:1px;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px;font-weight:800}
.sub{text-align:center;color:#94a3b8;font-size:14px;margin-bottom:24px}
.field{display:block;margin-bottom:22px}
.field span{display:block;font-size:13px;color:#94a3b8;margin-bottom:8px;font-weight:600;letter-spacing:.5px}
.field input{width:100%;padding:14px 16px;border-radius:12px;background:#0d1626;border:1px solid #2b3a55;color:#e2e8f0;font-size:16px;font-family:inherit;outline:none;transition:.2s}
.field input:focus{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.field input.err{border-color:#ef4444;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.label-diff{font-size:13px;color:#94a3b8;margin-bottom:10px;font-weight:600;letter-spacing:.5px}
.diff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(max-width:520px){.diff-grid{grid-template-columns:1fr}}
.diff{text-align:left;padding:13px 15px;border-radius:13px;cursor:pointer;background:#101a2c;border:1.5px solid #26344d;color:#cbd5e1;transition:.18s;font-family:inherit}
.diff:hover{border-color:#3b82f6;transform:translateY(-2px)}
.diff.on{border-color:#38bdf8;background:rgba(56,189,248,.12);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
.diff b{display:block;font-size:15px;margin-bottom:3px;color:#f1f5f9}
.diff small{font-size:11.5px;color:#8fa3bd;line-height:1.45;display:block}
.diff.on b{color:#38bdf8}
.diff.pvp{border-color:#a855f7}
.diff.pvp.on{background:rgba(168,85,247,.12);border-color:#a855f7}
.diff.pvp.on b{color:#c084fc}
.btn-primary{width:100%;padding:15px;border:none;border-radius:13px;cursor:pointer;font-size:16px;font-weight:800;letter-spacing:1px;font-family:inherit;background:linear-gradient(90deg,#0ea5e9,#6366f1);color:#fff;box-shadow:0 10px 26px rgba(56,189,248,.28);transition:.2s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(56,189,248,.4)}
.btn-primary:active{transform:scale(.98)}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-radius:13px;background:#101a2c;border:1.5px solid #26344d;margin-bottom:22px;cursor:pointer;transition:.2s}
.toggle-row:hover{border-color:#f59e0b}
.toggle-row.on{border-color:#f59e0b;background:rgba(245,158,11,.08)}
.toggle-row .lbl b{font-size:14px;color:#f1f5f9;display:block}
.toggle-row .lbl small{font-size:11.5px;color:#94a3b8}
.toggle-row.on .lbl b{color:#fbbf24}
.toggle-switch{width:46px;height:26px;border-radius:99px;background:#334155;position:relative;transition:.2s;flex-shrink:0}
.toggle-switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#94a3b8;transition:.2s}
.toggle-row.on .toggle-switch{background:#f59e0b}
.toggle-row.on .toggle-switch::after{left:23px;background:#fff}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.who{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#cbd5e1;min-width:0}
.who .ava{width:32px;height:32px;border-radius:50%;flex:0 0 32px;background:linear-gradient(135deg,#0ea5e9,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.who span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:#101a2c;border:1px solid #26344d;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;color:#cbd5e1}
.chip b{color:#38bdf8}
.chip.streak b{color:#f59e0b}
.chip.streak.hot{border-color:#f59e0b;box-shadow:0 0 14px rgba(245,158,11,.35);animation:pulse 1s infinite alternate}
.chip.curse{border-color:#ef4444;background:rgba(239,68,68,.12)}
.chip.curse b{color:#f87171}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}
.btn-quit{background:transparent;border:1px solid #3b4a63;color:#94a3b8;padding:7px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-family:inherit;transition:.2s}
.btn-quit:hover{border-color:#ef4444;color:#ef4444}
.prog-wrap{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.prog{flex:1;height:7px;background:#16233a;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#0ea5e9,#8b5cf6);transition:width .35s}
.prog-txt{font-size:12px;color:#7c8ba3;font-weight:700;white-space:nowrap}
.timer-wrap{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.timer-track{flex:1;height:9px;background:#16233a;border-radius:99px;overflow:hidden}
.timer-fill{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#22c55e,#4ade80);transition:width .1s linear,background .3s}
.timer-txt{font-size:13px;font-weight:800;color:#94a3b8;min-width:42px;text-align:right}
.pvp-board{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;padding:10px;background:rgba(13,22,38,.85);border:1px solid #26344d;border-radius:13px}
@media(min-width:520px){.pvp-board{grid-template-columns:repeat(4,1fr)}}
.pvp-player{padding:8px;border-radius:10px;background:#101a2c;border:1.5px solid #26344d;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.pvp-player.me{border-color:#38bdf8;background:rgba(56,189,248,.1)}
.pvp-player.correct{border-color:#22c55e;background:rgba(34,197,94,.12)}
.pvp-player.wrong{border-color:#ef4444;background:rgba(239,68,68,.12)}
.pvp-player.frozen{opacity:.45;border-color:#38bdf8}
.pvp-player .ava{font-size:22px}
.pvp-player .nm{font-size:11px;font-weight:700;color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pvp-player .sc{font-size:15px;font-weight:900;color:#38bdf8}
.pvp-player.me .nm{color:#7dd3fc}
.qbox{background:rgba(13,22,38,.9);border:1px solid #26344d;border-radius:16px;padding:18px;margin-bottom:16px}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1px;padding:4px 10px;border-radius:99px;background:#1e293b;color:#7c8ba3;margin-bottom:10px}
.badge.review{background:rgba(245,158,11,.16);color:#fbbf24;border:1px solid rgba(245,158,11,.4)}
.badge.curse{background:rgba(239,68,68,.16);color:#f87171;border:1px solid rgba(239,68,68,.4)}
#qText{font-size:clamp(15px,2.6vw,17.5px);line-height:1.6;font-weight:600;color:#e8eefc}
.options{display:flex;flex-direction:column;gap:10px}
.options.locked .option{pointer-events:none}
.option{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;border-radius:13px;border:1.5px solid #2b3a55;background:#101a2c;color:#dbe4f3;font-size:15px;line-height:1.5;cursor:pointer;transition:.16s;font-family:inherit}
.option:hover{border-color:#38bdf8;background:#16233a;transform:translateX(4px)}
.option .letter{flex:0 0 28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#26344d;font-weight:800;font-size:13px;color:#a8b8d0;transition:.16s}
.option .otext{flex:1;padding-top:2px}
.option.correct{background:rgba(34,197,94,.16);border-color:#22c55e;color:#bbf7d0;animation:pop .3s}
.option.correct .letter{background:#22c55e;color:#052e16}
.option.wrong{background:rgba(239,68,68,.16);border-color:#ef4444;color:#fecaca;animation:shake .4s}
.option.wrong .letter{background:#ef4444;color:#450a0a}
.option.eliminated{opacity:.25;text-decoration:line-through;pointer-events:none}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.025)}100%{transform:scale(1)}}
.feedback{margin-top:14px;font-size:14.5px;font-weight:700;min-height:22px;text-align:center;letter-spacing:.3px}
.feedback.ok{color:#4ade80}
.feedback.no{color:#f87171}
.inv-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px;background:rgba(13,22,38,.85);border:1px solid #26344d;border-radius:13px;margin:12px 0;min-height:60px;align-items:center}
.inv-bar .empty{color:#64748b;font-size:12.5px;font-weight:600;font-style:italic}
.item-btn{position:relative;width:52px;height:52px;border-radius:12px;border:2px solid;background:#0d1626;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;transition:.2s}
.item-btn:hover{transform:scale(1.12);filter:brightness(1.3)}
.item-btn .cnt{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:10px;font-weight:900;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #0d1626}
.item-btn.gold{border-color:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,.5)}
.item-btn.freezeTime{border-color:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,.5)}
.item-btn.double{border-color:#f472b6;box-shadow:0 0 10px rgba(244,114,182,.5)}
.item-btn.freezeBot{border-color:#22d3ee;box-shadow:0 0 10px rgba(34,211,238,.5)}
.item-btn.fifty{border-color:#a855f7;box-shadow:0 0 10px rgba(168,85,247,.5)}
.surprise-popup{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .3s}
.surprise-box{background:linear-gradient(160deg,#1a2440,#2a1a40);border:2px solid #fbbf24;border-radius:20px;padding:24px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 0 40px rgba(251,191,36,.5);animation:popIn .4s}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.surprise-box.curse{background:linear-gradient(160deg,#401a1a,#2a1a40);border-color:#ef4444;box-shadow:0 0 40px rgba(239,68,68,.5)}
.surprise-box .tag{display:inline-block;padding:4px 12px;border-radius:99px;background:rgba(251,191,36,.2);color:#fbbf24;font-size:11px;font-weight:800;letter-spacing:1.5px;margin-bottom:10px}
.surprise-box.curse .tag{background:rgba(239,68,68,.2);color:#f87171}
.surprise-box .icon{font-size:60px;margin:6px 0;display:block;animation:bounce 1s infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.surprise-box h3{font-size:19px;color:#fbbf24;margin-bottom:6px}
.surprise-box.curse h3{color:#f87171}
.surprise-box p{color:#cbd5e1;font-size:14px;line-height:1.55;margin-bottom:16px}
.surprise-box .btn-claim{width:100%;padding:13px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:800;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#1a1a1a;border:none}
.surprise-box.curse .btn-claim{background:linear-gradient(90deg,#ef4444,#dc2626);color:#fff}
.effect-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.effect-badge{padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:800;background:rgba(56,189,248,.15);border:1px solid #38bdf8;color:#7dd3fc}
.effect-badge.curse{background:rgba(239,68,68,.15);border-color:#ef4444;color:#f87171}
.end-title{text-align:center;font-size:26px;font-weight:800;margin-bottom:6px;background:linear-gradient(90deg,#38bdf8,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.end-name{text-align:center;color:#94a3b8;font-size:15px;margin-bottom:22px}
.score-big{text-align:center;font-size:clamp(40px,10vw,64px);font-weight:900;line-height:1;background:linear-gradient(90deg,#fbbf24,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.score-lbl{text-align:center;font-size:13px;color:#7c8ba3;letter-spacing:2px;font-weight:700;margin-bottom:22px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
@media(max-width:520px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat{background:#101a2c;border:1px solid #26344d;border-radius:13px;padding:13px 8px;text-align:center}
.stat b{display:block;font-size:20px;margin-bottom:3px;color:#38bdf8}
.stat.g b{color:#4ade80}.stat.r b{color:#f87171}.stat.y b{color:#fbbf24}
.stat small{font-size:11.5px;color:#7c8ba3;font-weight:600}
.wrong-list{max-height:280px;overflow-y:auto;margin-bottom:22px;padding-right:4px}
.wrong-list h3{font-size:14px;color:#f87171;margin-bottom:10px;letter-spacing:.5px}
.wrong-item{background:#101a2c;border-left:3px solid #ef4444;border-radius:9px;padding:11px 13px;margin-bottom:9px;font-size:13.5px;line-height:1.55}
.wrong-item .q{color:#cbd5e1;font-weight:600;margin-bottom:6px}
.wrong-item .a{color:#4ade80;font-size:13px}
.wrong-item .a b{color:#22c55e}
.btn-row{display:flex;gap:10px}
.btn-ghost{flex:1;padding:14px;border-radius:13px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;background:transparent;color:#cbd5e1;border:1.5px solid #2b3a55;transition:.2s}
.btn-ghost:hover{border-color:#38bdf8;color:#38bdf8}
.foot{text-align:center;font-size:11.5px;color:#4a5a73;margin-top:16px}
</style>
</head>
<body>
<div class="app">

<section id="screenStart" class="screen active">
  <div class="card">
    <h1>⚔️ ĐẤU TRƯỜNG LỊCH SỬ</h1>
    <p class="sub">Ôn tập giữa kì • 23 câu • Liên hợp quốc – Ianta – ASEAN</p>
    <label class="field">
      <span>NHẬP TÊN CỦA BẠN</span>
      <input id="playerName" type="text" maxlength="20" placeholder="VD: Nguyễn Văn A" autocomplete="off">
    </label>
    <p class="label-diff">CHỌN MỨC ĐỘ</p>
    <div class="diff-grid" id="diffGrid"></div>
    <div class="toggle-row" id="toggleHardcore">
      <div class="lbl">
        <b>⚡ Chế độ khắc nghiệt</b>
        <small>Giảm 1/2 thời gian mỗi câu</small>
      </div>
      <div class="toggle-switch"></div>
    </div>
    <button class="btn-primary" id="btnStart">BẮT ĐẦU ⚔️</button>
    <p class="foot">Chúc bạn chinh phục được 23 câu hỏi!</p>
  </div>
</section>

<section id="screenQuiz" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="who">
        <div class="ava" id="avatar">?</div>
        <span class="nm" id="hudName">Player</span>
      </div>
      <div class="stats">
        <div class="chip">🏆 <b id="hudScore">0</b></div>
        <div class="chip streak" id="streakChip">🔥 <b id="hudStreak">x1.0</b></div>
        <div class="chip curse" id="curseChip" style="display:none">💀 <b id="hudCurse">4</b></div>
        <button class="btn-quit" id="btnQuit">Thoát</button>
      </div>
    </div>
    <div id="pvpBoard" class="pvp-board" style="display:none"></div>
    <div id="effectBadges" class="effect-badges" style="display:none"></div>
    <div class="prog-wrap">
      <div class="prog"><i id="progFill"></i></div>
      <div class="prog-txt" id="progTxt">0/23</div>
    </div>
    <div class="timer-wrap">
      <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      <div class="timer-txt" id="timerText">--s</div>
    </div>
    <div class="qbox">
      <div class="badge" id="qBadge">CÂU HỎI</div>
      <div id="qText">...</div>
    </div>
    <div class="options" id="options"></div>
    <div class="inv-bar" id="invBar" style="display:none">
      <span class="empty">Túi đồ trống</span>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
</section>

<section id="screenEnd" class="screen">
  <div class="card">
    <div class="end-title" id="endTitle">HOÀN THÀNH!</div>
    <div class="end-name" id="endName"></div>
    <div class="score-big" id="endScore">0</div>
    <div class="score-lbl">TỔNG ĐIỂM</div>
    <div class="stat-grid">
      <div class="stat g"><b id="stCorrect">0</b><small>ĐÚNG</small></div>
      <div class="stat r"><b id="stWrong">0</b><small>SAI</small></div>
      <div class="stat y"><b id="stAcc">0%</b><small>CHÍNH XÁC</small></div>
      <div class="stat"><b id="stStreak">0</b><small>CHUỖI DÀI</small></div>
    </div>
    <div class="wrong-list" id="wrongList"></div>
    <div class="btn-row">
      <button class="btn-ghost" id="btnHome">🏠 Trang chủ</button>
      <button class="btn-primary" id="btnReplay" style="flex:1">🔄 CHƠI LẠI</button>
    </div>
  </div>
</section>

</div>
<script>
const QUESTIONS = [
  { q:"Nội dung nào sau đây phản ánh đúng về bối cảnh thành lập Liên hợp quốc (1945)?",
    o:["Phe Liên minh có nhu cầu giải quyết mâu thuẫn với phe Trục.",
       "Mỹ phát động cuộc chiến tranh thế giới mới để thực hiện chiến lược toàn cầu.",
       "Trật tự thế giới hai cực I-an-ta được xác lập trên thế giới.",
       "Các nước trong phe Đồng minh còn tồn tại những bất đồng."], a:3 },
  { q:"Sự kiện nào sau đây đánh dấu Liên hợp quốc chính thức được thành lập (1945)?",
    o:["Liên Xô, Mỹ, Anh khẳng định quyết tâm thành lập Liên hợp quốc tại Hội nghị Tê-hê-ran.",
       "Đại diện 26 nước kí bản Tuyên bố Liên hợp quốc tại Mỹ.",
       "Nguyên thủ của Liên Xô, Mỹ, Anh thống nhất thành lập Liên hợp quốc tại Hội nghị I-an-ta.",
       "Quốc hội các nước thành viên phê chuẩn Hiến chương Liên hợp quốc."], a:3 },
  { q:"Một trong những mục đích của tổ chức Liên hợp quốc là",
    o:["trừng trị các hoạt động gây chiến tranh.","thúc đẩy quan hệ thương mại tự do.",
       "duy trì hòa bình và an ninh thế giới.","ngăn chặn tình trạng ô nhiễm môi trường."], a:2 },
  { q:"Nội dung nào sau đây là một trong những nguyên tắc hoạt động của Liên hợp quốc?",
    o:["Thúc đẩy mối quan hệ hữu nghị giữa các quốc gia.",
       "Không can thiệp vào công việc nội bộ của các nước.",
       "Hợp tác để giải quyết các vấn đề quốc tế.",
       "Duy trì hòa bình và an ninh quốc tế."], a:1 },
  { q:"Một trong những hoạt động của Liên hợp quốc để duy trì hòa bình và an ninh quốc tế là",

let hardcoreMode = false;

let pendingTimeout = null;

const $ = id => document.getElementById(id);
const norm = s => s.trim().toLowerCase().replace(/\s+/g," ");
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* Build diff grid */
(function buildDiffGrid(){
  const grid = $("diffGrid");
  Object.entries(DIFFICULTIES).forEach(([key,d])=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "diff" + (key===selectedDiff ? " on" : "") + (d.pvp ? " pvp" : "");
    b.dataset.key = key;
    b.innerHTML = `<b>${d.label}</b><small>${d.desc}</small>`;
    b.onclick = ()=>{
      selectedDiff = key;
      [...grid.children].forEach(c=>c.classList.toggle("on", c.dataset.key===key));
    };
    grid.appendChild(b);
  });
})();

$("btnStart").onclick = ()=>{

function startGame(name, diff){
  clearTimeout(pendingTimeout);
  const cfg = DIFFICULTIES[diff];
  let totalTime = cfg.time;
  if(hardcoreMode) totalTime = Math.max(10, Math.round(totalTime/2));

  S = {
    name, diff, cfg, totalTime,
    queue: shuffle([...Array(QUESTIONS.length).keys()]),
    current: null, questionNumber: 0,
    score: 0, streak: 0, bestStreak: 0,
    correctCount: 0, wrongCount: 0,
    wrongPool: new Set(), wrongLog: [],
    answered: false, pendingReview: false,
    timerId: null, timeLeft: 0,
    dead: false,
    /* Inventory */
    inventory: {},           /* {gold: 1, double: 2...} */
    doubleActive: false,
    /* Curse */
    curseRemaining: 0,       /* còn bao nhiêu câu bị -x2 */
    /* PvP */
    isPvP: cfg.pvp,
    bots: [],
    frozenBots: {},          /* botIndex -> số câu còn đóng băng */
    /* History */
    botHistory: []
  };

  if(S.isPvP) setupBots();
  $("hudName").textContent = name;
  $("avatar").textContent = name.charAt(0).toUpperCase();
  $("pvpBoard").style.display = S.isPvP ? "grid" : "none";
  $("invBar").style.display = S.isPvP ? "flex" : "none";
  $("effectBadges").style.display = S.isPvP ? "flex" : "none";
  $("curseChip").style.display = "none";

  updateHud();
  updateInventory();
  updatePvpBoard();
  showScreen("screenQuiz");
  nextQuestion();
}

function setupBots(){
  const pool = shuffle([...BOT_POOL]);
  const numBots = 3;
  S.bots = [];
  for(let i=0;i<numBots;i++){
    const base = pool[i];
    S.bots.push({
      name: base.name,
      ava: base.ava,
      speed: base.speed,
      acc: base.acc,
      score: 0,
      lastResult: null,
      isMe: false
    });
  }
}

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active", s.id===id));
  window.scrollTo({top:0, behavior:"smooth"});
}
  function buildOptions(qIdx, hard){
  const q = QUESTIONS[qIdx];
  const correctText = q.o[q.a];
  let list;
  if(!hard){
    list = q.o.map((t,i)=>({ text:t, correct:i===q.a }));
  } else {
    const seen = new Set([norm(correctText)]);
    const pool = [];
    QUESTIONS.forEach((other,oi)=>{
      if(oi===qIdx) return;
      other.o.forEach(t=>{
        const n = norm(t);
        if(seen.has(n)) return;
        seen.add(n); pool.push(t);
      });
    });
    shuffle(pool);
    const picked = pool.slice(0,3);
    list = [{ text:correctText, correct:true }, ...picked.map(t=>({ text:t, correct:false }))];
  }
  return shuffle(list);
}

function nextQuestion(){
  if(!S || S.dead) return;
  if(S.pendingReview){
    S.pendingReview = false;
    if(S.wrongPool.size > 0){
      const arr = [...S.wrongPool];
      const qi = arr[Math.floor(Math.random()*arr.length)];
      S.current = { qIndex:qi, options: buildOptions(qi, S.cfg.hard), isReview:true };
      renderQuestion(); return;
    }
  }
  if(S.queue.length === 0){ endGame(); return; }
  const qi = S.queue.shift();
  S.current = { qIndex:qi, options: buildOptions(qi, S.cfg.hard), isReview:false };
  renderQuestion();
}

function renderQuestion(){
  const cur = S.current;
  const q = QUESTIONS[cur.qIndex];
  S.answered = false;
  S.questionNumber++;

  $("qText").textContent = q.q;
  const badge = $("qBadge");
  if(S.curseRemaining > 0){
    badge.textContent = "💀 LỜI NGUYỀN -x2 (còn " + S.curseRemaining + " câu)";
    badge.className = "badge curse";
  } else if(cur.isReview){
    badge.textContent = "🔁 ÔN LẠI CÂU ĐÃ SAI";
    badge.className = "badge review";
  } else {
    badge.textContent = "CÂU HỎI";
    badge.className = "badge";
  }

  const box = $("options");
  box.innerHTML = "";
  box.classList.remove("locked");
  cur.options.forEach((opt,i)=>{
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "option";
    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = "ABCD"[i];
    const txt = document.createElement("span");
    txt.className = "otext";
    txt.textContent = opt.text;
    btn.append(letter, txt);
    btn.onclick = ()=>handleAnswer(i);
    box.appendChild(btn);
  });

  $("feedback").textContent = "";
  $("feedback").className = "feedback";

  updateProgress();
  updateInventory();
  updatePvpBoard();
  startTimer();

  /* Bot trả lời (PvP) */
  if(S.isPvP) scheduleBotsAnswer();
}

function startTimer(){
  clearInterval(S.timerId);
  S.timeLeft = S.totalTime;
  paintTimer();
  S.timerId = setInterval(()=>{
    if(!S || S.dead){ clearInterval(S.timerId); return; }
    S.timeLeft -= 0.1;
    if(S.timeLeft <= 0){
      S.timeLeft = 0;
      paintTimer();
      clearInterval(S.timerId);
      handleAnswer(-1);
    } else paintTimer();
  }, 100);
}

function paintTimer(){
  const p = Math.max(0, S.timeLeft / S.totalTime) * 100;
  const fill = $("timerFill");
  fill.style.width = p + "%";
  fill.style.background = p>50 ? "linear-gradient(90deg,#22c55e,#4ade80)"
    : p>20 ? "linear-gradient(90deg,#f59e0b,#fbbf24)"
    : "linear-gradient(90deg,#dc2626,#ef4444)";
  $("timerText").textContent = Math.ceil(S.timeLeft) + "s";
  $("timerText").style.color = p<=20 ? "#f87171" : "#94a3b8";
}

function handleAnswer(selected){
  if(!S || S.answered || S.dead) return;
  S.answered = true;
  clearInterval(S.timerId);

  const cur = S.current;
  const correctIdx = cur.options.findIndex(o => o.correct);
  const btns = [...$("options").children];
  $("options").classList.add("locked");
  const isCorrect = (selected === correctIdx);

  if(isCorrect){
    btns[correctIdx].classList.add("correct");
    S.streak++;
    if(S.streak > S.bestStreak) S.bestStreak = S.streak;

    /* Tính điểm */
    const mult = S.streak >= 2 ? 1.5 : 1;
    let gain = Math.round(100 * mult);
    if(S.doubleActive){ gain *= 2; S.doubleActive = false; }
    S.score += gain;
    S.correctCount++;

    if(cur.isReview) S.wrongPool.delete(cur.qIndex);

    let msg = `✅ Chính xác! +${gain} điểm`;
    if(mult===1.5) msg += ` 🔥 x1.5`;
    if(S.doubleActive===false && gain>=200) msg += ` ⚡ x2`;
    setFeedback(true, msg);

    /* Chuỗi 5 -> rơi vật phẩm */
    if(S.streak >= 5 && S.streak % 5 === 0){
      setTimeout(()=>tryDropItem(), 700);
    }

    /* Cứ 10 câu đúng -> ôn lại */
    if(S.correctCount % 10 === 0 && S.wrongPool.size > 0){
      S.pendingReview = true;
    }
  } else {
    if(selected >= 0) btns[selected].classList.add("wrong");
    btns[correctIdx].classList.add("correct");
    S.streak = 0;
    S.wrongCount++;
    S.wrongPool.add(cur.qIndex);
    S.wrongLog.push(cur.qIndex);

    /* Trừ điểm */
    let penalty = 50;
    if(S.curseRemaining > 0){
      penalty = 100;  /* -x2 */
      S.curseRemaining--;
      if(S.curseRemaining <= 0){
        setTimeout(()=>alert("💀 Lời nguyền đã kết thúc!"), 1200);
      }
    }
    S.score = Math.max(0, S.score - penalty);

    const ansLetter = "ABCD"[correctIdx];
    let msg = selected<0 ? `⏰ Hết giờ! Đáp án đúng: ${ansLetter}` : `❌ Sai! Đáp án đúng: ${ansLetter}`;
    msg += ` (-${penalty}đ)`;
    if(S.curseRemaining >= 0 && penalty === 100) msg += ` 💀`;
    setFeedback(false, msg);

    /* 25% cơ hội nhận lời nguyền */
    if(S.curseRemaining <= 0 && Math.random() < 0.25){
      setTimeout(()=>showCursePopup(), 1000);
    }
  }

  updateHud();
  updatePvpBoard();

  const delay = isCorrect ? 1200 : 1900;
  clearTimeout(pendingTimeout);
  pendingTimeout = setTimeout(()=>{
    if(S && !S.dead) nextQuestion();
  }, delay);
}

function setFeedback(ok, text){
  const f = $("feedback");
  f.textContent = text;
  f.className = "feedback " + (ok ? "ok" : "no");
}

function updateHud(){
  $("hudScore").textContent = S.score.toLocaleString("vi-VN");
  $("hudStreak").textContent = S.streak >= 2 ? "x1.5" : "x1.0";
  $("streakChip").classList.toggle("hot", S.streak >= 2);
  if(S.curseRemaining > 0){
    $("curseChip").style.display = "flex";
    $("hudCurse").textContent = S.curseRemaining;
  } else {
    $("curseChip").style.display = "none";
  }
}

function updateProgress(){
  const done = QUESTIONS.length - S.queue.length;
  $("progFill").style.width = (done / QUESTIONS.length * 100) + "%";
  $("progTxt").textContent = `${Math.min(done+1, QUESTIONS.length)}/${QUESTIONS.length}`;
}

/* ==================== VẬT PHẨM ==================== */
function tryDropItem(){
  if(Math.random() > 0.7) return;  /* 70% */
  const keys = Object.keys(ITEMS);
  /* Nếu không phải PvP, loại bỏ freezeBot */
  const validKeys = S.isPvP ? keys : keys.filter(k=>k!=="freezeBot");
  const key = validKeys[Math.floor(Math.random()*validKeys.length)];
  S.inventory[key] = (S.inventory[key] || 0) + 1;
  updateInventory();
  showItemPopup(key);
}

function showItemPopup(key){
  const item = ITEMS[key];
  const pop = document.createElement("div");
  pop.className = "surprise-popup";
  pop.innerHTML = `
    <div class="surprise-box">
      <span class="tag">✨ PHẦN THƯỞNG CHUỖI ${S.streak}</span>
      <span class="icon">${item.icon}</span>
      <h3>${item.name}</h3>
      <p>${item.desc}</p>
      <button class="btn-claim" onclick="this.closest('.surprise-popup').remove()">TUYỆT VỜI! 🎉</button>
    </div>
  `;
  document.body.appendChild(pop);
  setTimeout(()=>{ if(pop.parentNode) pop.remove(); }, 4000);
}

function showCursePopup(){
  if(!S) return;
  S.curseRemaining = 4;
  const pop = document.createElement("div");
  pop.className = "surprise-popup";
  pop.innerHTML = `
    <div class="surprise-box curse">
      <span class="tag">💀 TÌNH HUỐNG BẤT NGỜ</span>
      <span class="icon">💀</span>
      <h3>LỜI NGUYỀN -x2 ĐIỂM</h3>
      <p>Trong <b>4 câu tiếp theo</b>, mỗi lần trả lời sai bạn sẽ bị trừ <b>GẤP ĐÔI điểm</b> (-100đ thay vì -50đ).</p>
      <button class="btn-claim" onclick="this.closest('.surprise-popup').remove()">CHẤP NHẬN 😰</button>
    </div>
  `;
  document.body.appendChild(pop);
  updateHud();
  setTimeout(()=>{ if(pop.parentNode) pop.remove(); }, 5000);
}

function updateInventory(){
  if(!S || !S.isPvP){ $("invBar").style.display = "none"; return; }
  const bar = $("invBar");
  bar.style.display = "flex";
  const keys = Object.keys(S.inventory).filter(k=>S.inventory[k] > 0);
  if(keys.length === 0){
    bar.innerHTML = '<span class="empty">Túi đồ trống — chuỗi 5 để nhận vật phẩm!</span>';
    return;
  }
  bar.innerHTML = "";
  keys.forEach(key=>{
    const item = ITEMS[key];
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "item-btn " + item.cls;
    btn.innerHTML = `${item.icon}<span class="cnt">${S.inventory[key]}</span>`;
    btn.title = item.name + " - " + item.desc;
    btn.onclick = ()=>useItem(key);
    bar.appendChild(btn);
  });
}

function useItem(key){
  if(!S || S.answered) return;
  if(!S.inventory[key] || S.inventory[key] <= 0) return;

  if(key === "gold"){
    S.score += 200;
    S.inventory[key]--;
    setFeedback(true, "💰 +200 điểm!");
  }
  else if(key === "freezeTime"){
    S.timeLeft = Math.min(S.totalTime, S.timeLeft + 30);
    paintTimer();
    S.inventory[key]--;
    setFeedback(true, "⏱️ +30 giây!");
  }
  else if(key === "double"){
    S.doubleActive = true;
    S.inventory[key]--;
    setFeedback(true, "⚡ Câu tiếp theo x2 điểm!");
  }
  else if(key === "freezeBot"){
    if(!S.isPvP){ S.inventory[key]--; return; }
    /* Đóng băng bot chưa bị đóng băng */
    const avail = S.bots.map((b,i)=>i).filter(i=>!S.frozenBots[i]);
    if(avail.length === 0){
      setFeedback(false, "❄️ Tất cả bot đã bị đóng băng!");
      return;
    }
    const target = avail[Math.floor(Math.random()*avail.length)];
    S.frozenBots[target] = 2;
    S.inventory[key]--;
    setFeedback(true, `❄️ Đã đóng băng ${S.bots[target].name}!`);
  }
  else if(key === "fifty"){
    /* Loại 2 đáp án sai */
    const cur = S.current;
    const wrongIdxs = cur.options.map((o,i)=>o.correct ? -1 : i).filter(i=>i>=0);
    shuffle(wrongIdxs);
    const remove = wrongIdxs.slice(0,2);
    const btns = [...$("options").children];
    remove.forEach(i=>btns[i].classList.add("eliminated"));
    S.inventory[key]--;
    setFeedback(true, "🎯 Đã loại 2 đáp án sai!");
  }

  updateHud();
  updateInventory();
}

/* ==================== PVP BOTS ==================== */
function scheduleBotsAnswer(){
  S.bots.forEach((bot, idx)=>{
    bot.lastResult = null;
    if(S.frozenBots[idx] && S.frozenBots[idx] > 0){
      S.frozenBots[idx]--;
      return;
    }
    /* Bot trả lời sau khoảng tg dựa trên speed */
    const delay = (1.5 + Math.random()*3) * (1 / bot.speed);
    const willBeCorrect = Math.random() < bot.acc;
    setTimeout(()=>{
      if(!S || S.dead || S.answered === false) {
        /* Chỉ tính nếu câu chưa kết thúc — vẫn cho bot tính điểm để hiển thị */
      }
      if(!S) return;
      bot.lastResult = willBeCorrect ? "correct" : "wrong";
      if(willBeCorrect) bot.score += 100;
      updatePvpBoard();
    }, delay*1000);
  });
}

function updatePvpBoard(){
  if(!S || !S.isPvP) return;
  const board = $("pvpBoard");
  board.innerHTML = "";

  /* Me */
  const me = document.createElement("div");
  me.className = "pvp-player me";
  me.innerHTML = `<span class="ava">${S.name.charAt(0).toUpperCase()}</span><span class="nm">${S.name}</span><span class="sc">${S.score}</span>`;
  board.appendChild(me);

  /* Bots */
  S.bots.forEach((bot, idx)=>{
    const el = document.createElement("div");
    el.className = "pvp-player";
    if(bot.lastResult === "correct") el.classList.add("correct");
    if(bot.lastResult === "wrong") el.classList.add("wrong");
    if(S.frozenBots[idx] && S.frozenBots[idx] > 0) el.classList.add("frozen");
    el.innerHTML = `<span class="ava">${bot.ava}</span><span class="nm">${bot.name}</span><span class="sc">${bot.score}</span>`;
    board.appendChild(el);
  });
    }
  /* ==================== KẾT THÚC ==================== */
function endGame(){
  if(!S) return;
  S.dead = true;
  clearInterval(S.timerId);
  clearTimeout(pendingTimeout);

  const total = S.correctCount + S.wrongCount;
  const acc = total ? Math.round(S.correctCount/total*100) : 0;

  $("endName").textContent = `Người chơi: ${S.name} • Mức ${S.cfg.label}${hardcoreMode?" ⚡":""}`;
  $("endScore").textContent = S.score.toLocaleString("vi-VN");
  $("stCorrect").textContent = S.correctCount;
  $("stWrong").textContent = S.wrongCount;
  $("stAcc").textContent = acc + "%";
  $("stStreak").textContent = S.bestStreak;

  let title = "HOÀN THÀNH!";
  if(S.isPvP){
    /* Xếp hạng PvP */
    const all = [{name:S.name, score:S.score, me:true}, ...S.bots.map(b=>({name:b.name, score:b.score, me:false}))];
    all.sort((a,b)=>b.score - a.score);
    const rank = all.findIndex(p=>p.me) + 1;
    if(rank === 1) title = "🏆 VÔ ĐỊCH PVP!";
    else if(rank === 2) title = "🥈 Á QUÂN PVP!";
    else if(rank === 3) title = "🥉 HẠNG 3 PVP!";
    else title = "😢 HẠNG 4 PVP!";
  } else {
    if(acc>=90) title="🏆 XUẤT SẮC!";
    else if(acc>=70) title="🌟 RẤT TỐT!";
    else if(acc>=50) title="👍 CỐ GẮNG THÊM!";
    else title="📚 ÔN LẠI NHÉ!";
  }
  $("endTitle").textContent = title;

  const list = $("wrongList");
  list.innerHTML = "";
  const uniq = [...new Set(S.wrongLog)];
  if(uniq.length){
    const h = document.createElement("h3");
    h.textContent = `❗ CÁC CÂU BẠN ĐÃ LÀM SAI (${uniq.length})`;
    list.appendChild(h);
    uniq.forEach(qi=>{
      const q = QUESTIONS[qi];
      const d = document.createElement("div");
      d.className = "wrong-item";
      const qt = document.createElement("div");
      qt.className = "q";
      qt.textContent = q.q;
      const at = document.createElement("div");
      at.className = "a";
      at.innerHTML = `✔ Đáp án đúng: <b>${"ABCD"[q.a]}. ${q.o[q.a]}</b>`;
      d.append(qt, at);
      list.appendChild(d);
    });
  } else {
    const d = document.createElement("div");
    d.className = "wrong-item";
    d.style.borderLeftColor = "#22c55e";
    d.innerHTML = `<div class="q" style="color:#4ade80;margin:0">🎉 Tuyệt vời! Bạn không làm sai câu nào!</div>`;
    list.appendChild(d);
  }

  showScreen("screenEnd");
}

/* ==================== NÚT ĐIỀU KHIỂN ==================== */
$("btnQuit").onclick = ()=>{
  if(!S) return;
  if(confirm("Bạn có chắc muốn thoát? Kết quả sẽ không được lưu.")){
    S.dead = true;
    clearInterval(S.timerId);
    clearTimeout(pendingTimeout);
    S = null;
    showScreen("screenStart");
  }
};
$("btnHome").onclick = ()=>{ S = null; showScreen("screenStart"); };
$("btnReplay").onclick = ()=>{
  if(!S){ showScreen("screenStart"); return; }
  startGame(S.name, S.diff);
};

window.addEventListener("beforeunload", e => {
  if(S && !S.dead && S.questionNumber > 0){
    e.preventDefault();
    e.returnValue = "";
  }
});
</script>
