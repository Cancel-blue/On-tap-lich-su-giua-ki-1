<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập thi - Trang chủ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="home-header">
    <h1>📚 ÔN TẬP THI</h1>
    <p class="home-sub">Chọn môn để bắt đầu ôn luyện</p>
  </header>

  <div class="subject-grid">
    <a class="subject-card lich-su" href="game.html?mon=lich-su">
      <div class="subject-icon">📜</div>
      <div class="subject-name">LỊCH SỬ</div>
      <div class="subject-desc">23 câu • Giữa kì 1</div>
      <div class="subject-stats" id="stats-lich-su">Chưa chơi</div>
    </a>

    <a class="subject-card dia-ly" href="game.html?mon=dia-ly">
      <div class="subject-icon">🌍</div>
      <div class="subject-name">ĐỊA LÝ</div>
      <div class="subject-desc">Sắp có đề</div>
      <div class="subject-stats" id="stats-dia-ly">Chưa chơi</div>
    </a>

    <a class="subject-card vat-ly" href="game.html?mon=vat-ly">
      <div class="subject-icon">⚛️</div>
      <div class="subject-name">VẬT LÝ</div>
      <div class="subject-desc">Sắp có đề</div>
      <div class="subject-stats" id="stats-vat-ly">Chưa chơi</div>
    </a>

    <a class="subject-card toan" href="game.html?mon=toan">
      <div class="subject-icon">🔢</div>
      <div class="subject-name">TOÁN</div>
      <div class="subject-desc">Sắp có đề</div>
      <div class="subject-stats" id="stats-toan">Chưa chơi</div>
    </a>

    <a class="subject-card hoa" href="game.html?mon=hoa">
      <div class="subject-icon">🧪</div>
      <div class="subject-name">HÓA HỌC</div>
      <div class="subject-desc">Sắp có đề</div>
      <div class="subject-stats" id="stats-hoa">Chưa chơi</div>
    </a>
  </div>

  <footer class="home-footer">
    © 2026 • Đấu trường học tập
  </footer>
</div>

<script>
(function loadStats(){
  ["lich-su","dia-ly","vat-ly","toan","hoa"].forEach(mon=>{
    const best = localStorage.getItem("bestScore_" + mon);
    const plays = localStorage.getItem("plays_" + mon);
    const el = document.getElementById("stats-" + mon);
    if(el && best){
      el.textContent = "🏆 " + parseInt(best).toLocaleString("vi-VN") + "đ • " + (plays||0) + " lần";
    }
  });
})();
</script>
</body>
</html>
